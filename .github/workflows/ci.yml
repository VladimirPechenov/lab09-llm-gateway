name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest --junitxml=results/junit-ci.xml --durations=10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.python }}
          path: results/junit-ci.xml
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      - run: |
          python - <<'PY'
          import json, urllib.request
          def chat():
              r = urllib.request.Request("http://localhost:8000/v1/chat",
                  data=json.dumps({"npc":"trader","message":"Hello"}).encode(),
                  headers={"X-API-Key":"dev-key","Content-Type":"application/json"})
              return json.load(urllib.request.urlopen(r))
          assert not chat()["cached"]
          assert chat()["cached"]
          PY
      - run: docker compose logs --no-color > results/docker-ci.txt
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker
          path: results/docker-ci.txt
